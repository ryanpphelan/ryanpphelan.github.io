</g>

<!-- labels -->
<g font-family="Inter,sans-serif" font-size="10.5" fill="#191817" text-anchor="middle">
<text x="70" y="102">Market</text><text x="70" y="116">Definition</text>
<text x="210" y="102">Market</text><text x="210" y="116">Need</text>
<text x="350" y="102">Brand</text><text x="350" y="116">Definition</text>
