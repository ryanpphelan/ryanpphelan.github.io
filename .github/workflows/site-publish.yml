name: site-publish
# Deploys the whole site via GitHub Actions. Never pushes to the protected branch. On every push
# to main it re-validates every approved post (article + bound card images) before deploying,
# rebuilds the full site from the repo (including images/social/ static cards) and renders approved
# blog articles, then deploys and verifies articles and social card images are live.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install cryptography pillow
      - name: validator regression tests (encoding, social approvals, negative cases) BEFORE any deploy
        run: python3 -m unittest discover -s tests -v
      - name: re-validate every approved post BEFORE any deploy (privileged-deploy gate)
        run: |
          set -e
          shopt -s nullglob
          for ap in content/blog/*.approval.json; do
            python3 tools/validator.py --approval "$ap" --pubkey keys/approval-public.pem
          done
      - name: regenerate blog index, sitemap, llms.txt from approved posts
        run: python3 tools/gen_blog_indexes.py
      - name: assemble full site into _site (site + social cards), then render approved articles
        run: |
          set -e
          mkdir -p _site
          git ls-files | grep -vE '^(\.github/|tools/|keys/|scripts/|content/|tests/)|^(README\.md|\.gitignore)$' \
            | while IFS= read -r f; do mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; done
          shopt -s nullglob
          mkdir -p writing _site/writing
          for md in content/blog/*.md; do python3 tools/render_page.py "$md"; done
          [ -d writing ] && cp -r writing/. _site/writing/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: verify approved blog articles are live (content hash); skip if none
        run: |
          shopt -s nullglob
          if ls content/blog/*.md >/dev/null 2>&1; then
            BASE="${{ steps.deploy.outputs.page_url }}" bash scripts/verify_pages.sh
          else
            echo "no approved blog content this run; site deploy only"
          fi
      - name: verify approved social card images are live (served bytes == signed hash); HOLD social on failure
        run: BASE="${{ steps.deploy.outputs.page_url }}" bash scripts/verify_images.sh
