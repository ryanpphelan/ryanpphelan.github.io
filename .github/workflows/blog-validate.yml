name: blog-validate
# Required status check for pull requests. A PR may change only content/blog/** and
# images/social/<sha256>.png, and every changed file must be covered by a single signed approval
# (article by contentHash, each card image by exact SHA-256 in the approval's `assets`).
on:
  pull_request:
    branches: [ main ]
jobs:
  blog-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install cryptography pillow
      - name: compute changed files
        id: diff
        run: echo "files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: validate the signed approval covers exactly the changed files
        run: |
          set -e
          CHANGED="${{ steps.diff.outputs.files }}"
          echo "changed: $CHANGED"
          APPROVALS=$(echo "$CHANGED" | tr ',' '\n' | grep '^content/blog/.*\.approval\.json$' || true)
          if [ -z "$APPROVALS" ]; then
            if echo "$CHANGED" | tr ',' '\n' | grep -qE '^(content/blog/|images/social/)'; then
              echo "FAIL: content or image changed without a signed approval"; exit 1
            fi
            echo "no content/image changes; nothing to validate"; exit 0
          fi
          N=$(echo "$APPROVALS" | grep -c . || true)
          if [ "$N" -gt 1 ]; then echo "FAIL: submit one post (one approval) per PR; found $N"; exit 1; fi
          for ap in $APPROVALS; do
            python3 tools/validator.py --approval "$ap" --pubkey keys/approval-public.pem --changed "$CHANGED"
          done
